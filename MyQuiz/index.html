<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MyQUIZZ</title>
    <link rel="stylesheet" href="style.css"/>
</head>
<body>
    <div class="main-container">
        <div class="screen">
            <h1>MyQUIZZ</h1>
            <p class="start-message">Test your knowledge with our short quiz</p>
            <button>START QUIZ</button>
        </div>
        <div class="screen">
            <h2>this is where the question is</h2>
            <div class="quiz-info">
                <p>Question <span>1</span>/<span>5</span></p>
                <p>Score: <span>1</span></p>
            </div>
            <div class="answer-box">This is where the answers are</div>
            <div class="tracker-box">
                <div class="tracker"></div>
            </div>
        </div>
        <div class="screen active">
            <h1>Quiz Results</h1>
            <div class="feedback">
                <p>You scored <span>2</span> out of <span>5</span></p>
                <h2>Short Message</h2>
            </div>
            <button>RESTART QUIZ</button>
        </div>
    </div>
</body>
</html>
