<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quizly</title>
    <link rel="stylesheet" href="style.css"/>
</head>
<body>
    <div class="main-container">
        <div class="screen active">
            <h1>It's Quiz Time</h1>
            <p>You're here to test your knowledge</p>
            <button>Start Quiz</button>
        </div>
        <div class="screen">
            <h2>Here is the question</h2>
            <div>
                <p>Question <span>1</span> of <span>5</span></p>
                <p>Score: <span>1</span></p>
                <div>
                    here is the answers
                </div>
            </div>
        </div>
        <div class="screen">
            <h1>Quiz Results</h1>
            <p>You scored <span>1</span></p>
            <p>You did well</p>
            <button>Restart</button>
        </div>
    </div>  
</body>
</html>
