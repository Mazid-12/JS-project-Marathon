<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MyQUIZZ</title>
    <link rel="stylesheet" href="style.css"/>
</head>
<body>
    <div class="main-container">
        <div id="start-screen" class="screen active">
            <h1>MyQUIZZ</h1>
            <p class="start-message">Test your knowledge with our short quiz</p>
            <button class = "button" id="start-button">START QUIZ</button>
        </div>
        <div id="quiz-screen" class="screen">
            <h2 id="question">this is where the question is</h2>
            <div class="quiz-info">
                <p>Question <span id="current-question">0</span>/<span id="total-questions">0</span></p>
                <p>Score: <span id="score">0</span></p>
            </div>
            <div id ="answer-container" class="answer-box"></div>
            <div class="tracker-box">
                <div id="tracker"></div>
            </div>
        </div>
        <div id="end-screen" class="screen">
            <h1>Quiz Results</h1>
            <div class="feedback">
                <p>You scored <span id="final-score">2</span> out of <span id="total-number">5</span></p>
                <h2 id="final-message">Short Message</h2>
            </div>
            <button class = "button" id="restart-button">RESTART QUIZ</button>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
