<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MyQUIZZ</title>
    <link rel="stylesheet" href="style.css"/>
</head>
<body>
    <div>
        <div>
            <h1>MyQUIZZ</h1>
            <p>Test your knowledge with our short quiz</p>
            <button>START QUIZ</button>
        </div>
        <div>
            <h2>this is where the question is</h2>
            <div>
                <p>Question <span>1</span>/<span>5</span></p>
                <p>Score: <span>1</span></p>
            </div>
            <div>This is where the answers are</div>
            <div>tracking the percentage</div>
        </div>
        <div>
            <h1>Quiz Results</h1>
            <p>You scored <span>2</span></p>
            <p>Short Message</p>
            <button>RESTART QUIZ</button>
        </div>
    </div>
</body>
</html>
