<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My WeatherAPP</title>
    <link rel="stylesheet" href="style.css"/>
</head>
<body>
    <div class="container">
        <form class="userForm">
            <input type="text" placeholder="Enter city" id="input">
            <button type="submit" id="submitBtn">Get weather</button>
        </form>
        <div class="card">
            <h1 class="city">LOME</h1>
            <p class="temperature">80°C </p>
            <p class="humidity">Humity: 75%</p>
            <p class="skyState">Clear skies</p>
            <p class="weatherEmoji">☀️</p>
            <p class="errorMessage">Please enter a city</p>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
