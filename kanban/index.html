<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KanBan App</title>
    <link rel="stylesheet" href="style.css"/>
</head>
<body>
    <div class="saveCard hidden">
        <button type="button" class="cancelBtn">X</button>
        <form class="saveTask">
            <label>Task title</label>
            <input type="text" placeholder="What needs to be done?" id="taskInput"/>
            <button type="submit" class="submitBtn">Save Task</button>
        </form>
    </div>
        </form>
    <div class="container">
        <h1>KanBan App</h1>
        <div class="card">
            <div class="list" id="list1">
                <h2>To Do</h2>
                <div class="task" draggable="true" id="task1">
                    <p class="taskTitle" id="title1">Clean the room </p>
                    <div class="editTask">
                        <button class="editBtn writeTask">✒️</button>
                        <button class="editBtn deleteTask">X</button>
                    </div>
                </div>
                <div class="task" draggable="true" id="task2">
                    <p class="taskTitle" id="title2">Visit Parents</p>
                    <div class="editTask">
                        <button class="editBtn writeTask">✒️</button>
                        <button class="editBtn deleteTask">X</button>
                    </div>
                </div>
                <button type="submit" class="addTask">+</button>
            </div>
            <div class="list list2">
                <h2>In Progress</h2>
                <div class="task" draggable="true" id="task3">
                    <p class="taskTitle" id="title3">Go work</p>
                    <div class="editTask">
                        <button class="editBtn writeTask">✒️</button>
                        <button class="editBtn deleteTask">X</button>
                    </div>
                </div>
            </div>
            <div class="list">
                <h2>Done</h2>
                <div class="task" draggable="true" id="task4">
                    <p class="taskTitle" id="title4">edit video</p>
                    <div class="editTask">
                        <button class="editBtn writeTask">✒️</button>
                        <button class="editBtn deleteTask">X</button>
                    </div>
                </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
