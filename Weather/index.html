<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>myWeather</title>
</head>
<body>
    <form>
        <input type="text" placeholder="Enter your city"/>
        <button type="submit">Get Weather</button>
    </form>
    <div class="card">
        <h1 class="city">Miami</h1>
        <p class="temperature">12°C</p>
        <p class="humdity">Humitdity: 60%</p>
        <p class="description">Clear skies</p>
        <p class="emoji">☀️</p>
        <p class="errorMessage">Please, enter a city</p>
    </div>
</body>
</html>
