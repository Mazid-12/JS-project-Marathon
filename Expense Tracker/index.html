<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Tracker</title>
    <link rel="stylesheet" href="style.css"/>
</head>
<body>
    <h1>EXPENSELY - Your expense tracker</h1>
    <div class="main-container">
        <div class="balance">
            <p>YOUR BALANCE</p>
            <span id="totalBalance">$0</span>
        </div>
        <div class="totals">
            <div>
                <p>INCOME</p>
                <span id="income">$0</span>
            </div>
            <div>
                <p>EXPENSE</p>
                <span id="expense">$0</span>
            </div>
        </div>
        <div id="history">
            <p>History</p>
        </div>
        <div class="allForm">
            <p>Add new transaction</p>
            <form id="form">
                <div class="info">
                    <label for="type">Type</label>
                    <select id="type" required>
                        <option value="">--Please choose--</option>
                        <option value="expense" >Expense</option>
                        <option value="income">Income</option>
                    </select>
                </div>
                
                <div class="info">
                    <label for="nameTrans">Name</label>
                    <input type="text" placeholder="Enter the name of the transaction" id="nameTrans" autocomplete="off" required/>
                </div>
                <div class="info">
                    <label for="amountTrans">Amount</label>
                    <input type="text" placeholder="Enter the amount" id="amountTrans" autocomplete="off" required/>
                </div>
                <button type="submit" id="button">Add transaction</button>

            </form>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
