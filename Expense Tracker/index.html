<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Tracker</title>
</head>
<body>
    <h1>EXPENSELY - Your expense tracker</h1>
    <div>
        <h2>YOUR BALANCE</h2>
        <span>$1000</span>
    </div>
    <div>
        <div>
            <h3>INCOME</h3>
            <span>$100</span>
        </div>
        <div>
            <h3>EXPENSE</h3>
            <span>$100</span>
        </div>
    </div>
    <div>
        <p>History</p>
    </div>
    <div>
        <p>Add new transaction</p>
        <form>
            
            <div>
                <label>Name</label>
                <input type="text" placeholder="Enter the name of the transaction" required/>
            </div>
            <div>
                <label>Amount</label>
                <input type="text" placeholder="Enter the amount" required/>
            </div>
            <button type="submit">Add transaction</button>

        </form>
    </div>

</body>
</html>
