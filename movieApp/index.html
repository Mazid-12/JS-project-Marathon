<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie Search App</title>
    <link rel="stylesheet" href="style.css"/>
</head>
<body>
    <form id="input-form">
        <input type="Search" placeholder="Search for a movie" class="user-inter input"/>
        <button type="submit"  class="user-inter button">Search</button>
    </form>
    <div class="movie-card">
        <img class="poster" src="/images/inception.jpg" alt="initial image"/>
        <h3>2014, Action, Science fiction, Adventure </h3>
        <h4>Directed by:</h4><p></p> Christopher Nolan</p>
        <h4>Stars:</h4><p>Leonardo DiCaprio, Joseph Gordon-Levitt</p>
    </div>
</body>
</html>
