<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie Search App</title>
    <link rel="stylesheet" href="style.css"/>
</head>
<body>
    <form id="input-form">
        <input type="Search" placeholder="Search for a movie" class="user-inter input"/>
        <button type="submit"  class="user-inter button">Search</button>
    </form>
    <div class="search-list-box">
        <h1>MOVIES (15) - VIEW ALL:</h1>
        <div class="search-movie ">
            <img src="/images/dark Knight.jpg" class="search-poster"/>
            <p>Batman</p>
        </div>
        <div class="search-movie">
            <img src="/images/dark Knight.jpg" class="search-poster"/>
            <p>Batman</p>
        </div>
        <div class="search-movie">
            <img src="/images/dark Knight.jpg" class="search-poster"/>
            <p>Batman</p>
        </div>
    
    </div>
    <div class="movie-card">
        <img class="poster" src="/images/inception.jpg" alt="initial image"/>
        <h3>2014, Action, Science fiction, Adventure </h3>
        <h4>Plot:</h4><p>It is some of the best year of the life</p>
        <h4>Directed by:</h4><p> Christopher Nolan</p>
        <h4>Stars:</h4><p>Leonardo DiCaprio, Joseph Gordon-Levitt</p>
        <p class="error">Movie not found</p>
    </div>
    <script src="script.js"></script>
</body>
</html>
